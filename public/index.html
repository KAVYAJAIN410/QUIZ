<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(to right, #2980b9, #6dd5fa);
    }
    form {
      background-color: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 320px;
      display: none;
    }
    form.active {
      display: block;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="text"],
    input[type="password"],
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      box-sizing: border-box;
    }
    input[type="submit"] {
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      color: #007bff;
      cursor: pointer;
    }
    .toggle:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- LOGIN FORM -->
  <form id="login-form" class="active" action="/login" method="post">
    <h2>Login</h2>
    <input type="text" name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />
    <input type="submit" value="Login" />
    <div class="toggle" onclick="toggleForms()">Don't have an account? Sign up</div>
  </form>

  <!-- SIGNUP FORM -->
  <form id="signup-form" action="/signup" method="post">
    <h2>Sign Up</h2>
    <input type="text" name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />
    <input type="submit" value="Sign Up" />
    <div class="toggle" onclick="toggleForms()">Already have an account? Login</div>
  </form>

  <script>
    function toggleForms() {
      document.getElementById('login-form').classList.toggle('active');
      document.getElementById('signup-form').classList.toggle('active');
    }
  </script>

</body>
</html>
